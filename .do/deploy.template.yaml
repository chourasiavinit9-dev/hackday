spec:
  name: skillforge
  region: nyc

  databases:
    - engine: PG
      name: skillforge-db
      num_nodes: 1
      size: db-s-dev-database
      version: "16"

  services:
    - name: backend
      github:
        repo: chourasiavinit9-dev/hackday
        branch: main
        deploy_on_push: true
      source_dir: skillforge/backend
      http_port: 8000
      instance_size_slug: apps-s-1vcpu-1gb
      run_command: uvicorn main:app --host 0.0.0.0 --port 8000
      health_check:
        http_path: /health
        initial_delay_seconds: 15
        period_seconds: 10
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: ${skillforge-db.DATABASE_URL}
        - key: GEMINI_API_KEY
          scope: RUN_TIME
          type: SECRET
          value: ""
        - key: GEMMA_MODEL
          scope: RUN_TIME
          value: "gemma-4-26b-a4b-it"
        - key: SKILLFORGE_DEMO
          scope: RUN_TIME
          value: "false"

  static_sites:
    - name: frontend
      github:
        repo: chourasiavinit9-dev/hackday
        branch: main
        deploy_on_push: true
      source_dir: skillforge/frontend
      output_dir: .
      envs:
        - key: VITE_API_URL
          scope: BUILD_TIME
          value: ${backend.PUBLIC_URL}

  ingress:
    rules:
      - match:
          path:
            prefix: /api
        component:
          name: backend
      - match:
          path:
            prefix: /health
        component:
          name: backend
      - match:
          path:
            prefix: /
        component:
          name: frontend
